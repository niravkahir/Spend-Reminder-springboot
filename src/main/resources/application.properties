spring.application.name=spend-remainder

# Local defaults; use DB_SSL_MODE=REQUIRED for Aiven.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:expense_tracker}?sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

jwt.secret=${JWT_SECRET:local-development-secret-change-this-to-a-random-32-byte-minimum-secret}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.token-prefix=Bearer

server.port=${PORT:8080}
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.com.nirav.expense_tracker=${APP_LOG_LEVEL:INFO}
