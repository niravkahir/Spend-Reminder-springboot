
spring.application.name=spend-remainder

# Database Configuration (TiDB Cloud)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JWT Authentication
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.token-prefix=Bearer

# Server
server.port=${PORT:8080}

# CORS
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# Time Zone
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}

# AI Configuration
app.ai.provider=groq
app.groq.api-key=${GROQ_API_KEY}
app.groq.model=openai/gpt-oss-120b
app.groq.base-url=https://api.groq.com/openai/v1

# Logging
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.com.nirav.expense_tracker=${APP_LOG_LEVEL:INFO}
